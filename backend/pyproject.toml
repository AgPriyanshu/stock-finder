[project]
name = "stock-finder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Web framework.
    "Django>=5.1,<6.0",
    "djangorestframework>=3.15,<4.0",
    "django-cors-headers>=4.4,<5.0",
    "whitenoise>=6.7,<7.0",

    # ASGI server.
    "uvicorn[standard]>=0.30,<1.0",

    # Database.
    "psycopg[binary]>=3.1,<4.0",

    # Cache + Celery broker.
    "redis>=5.0,<8.0",
    "django-redis>=5.4,<7.0",
    "celery>=5.4,<6.0",

    # Auth.
    "PyJWT>=2.8,<3.0",

    # HTTP client (MSG91 OTP, outbound webhooks).
    "requests>=2.32,<3.0",

    # Image processing.
    "Pillow>=10.0,<13.0",

    # Object storage (SeaweedFS / S3).
    "boto3>=1.34,<2.0",

    # Logging.
    "python-json-logger>=2.0,<4.0",
]

# GDAL is intentionally absent — its Python package version must match the
# system libgdal version, so it is installed separately in the Dockerfile.

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["stock_finder", "apps", "shared"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "stock_finder.settings"
python_files = ["tests.py", "test_*.py"]
